[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overseas-income-tax"
version = "0.5.0"
description = "中国居民境外利息与普通现金股息的范围内税额测算工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
overseas-income-tax = "overseas_income_tax.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
overseas_income_tax = ["templates/*.html", "static/*.css", "static/*.js", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
